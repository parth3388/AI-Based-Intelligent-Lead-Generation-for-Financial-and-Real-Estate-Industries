<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial; }

body { background:#f4f6f9; }

header {
    background:#1e2a38; color:white;
    padding:15px 30px;
    display:flex; justify-content:space-between;
}

nav a { color:white; margin-left:15px; text-decoration:none; }

.container { padding:20px; }

.cards {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px; margin-bottom:20px;
}

.card {
    background:white; padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.transactions, .form-section {
    background:white; padding:20px;
    margin-top:20px;
    border-radius:10px;
}

input, button {
    padding:10px; margin:5px;
}

table { width:100%; margin-top:10px; }

th, td {
    padding:10px;
    border-bottom:1px solid #ddd;
}

.chart {
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<header>
<h2>Finance Dashboard</h2>
<nav>
<a href="#">Home</a>
<a href="#">Reports</a>
</nav>
</header>

<div class="container">

<!-- Cards -->
<div class="cards">
<div class="card"><h3>Balance</h3><p id="balance">$0</p></div>
<div class="card"><h3>Income</h3><p id="income">$0</p></div>
<div class="card"><h3>Expenses</h3><p id="expense">$0</p></div>
</div>

<!-- Add Transaction -->
<div class="form-section">
<h3>Add Transaction</h3>
<input type="text" id="desc" placeholder="Description">
<input type="number" id="amount" placeholder="Amount">
<button onclick="addTransaction()">Add</button>
</div>

<!-- Transactions -->
<div class="transactions">
<h3>Transactions</h3>
<table id="table">
<tr><th>Description</th><th>Amount</th></tr>
</table>
</div>

<!-- Chart -->
<div class="chart">
<h3>Overview</h3>
<canvas id="chart" width="400" height="200"></canvas>
</div>

</div>

<script>

let transactions = JSON.parse(localStorage.getItem("data")) || [];

function updateUI() {
    const table = document.getElementById("table");
    table.innerHTML = "<tr><th>Description</th><th>Amount</th></tr>";

    let income = 0, expense = 0;

    transactions.forEach(t => {
        let row = table.insertRow();
        row.insertCell(0).innerText = t.desc;
        row.insertCell(1).innerText = t.amount;

        if (t.amount > 0) income += t.amount;
        else expense += t.amount;
    });

    document.getElementById("income").innerText = "$" + income;
    document.getElementById("expense").innerText = "$" + Math.abs(expense);
    document.getElementById("balance").innerText = "$" + (income + expense);

    drawChart(income, Math.abs(expense));

    localStorage.setItem("data", JSON.stringify(transactions));
}

function addTransaction() {
    const desc = document.getElementById("desc").value;
    const amount = Number(document.getElementById("amount").value);

    if (!desc || !amount) {
        alert("Enter valid data");
        return;
    }

    transactions.push({ desc, amount });

    document.getElementById("desc").value = "";
    document.getElementById("amount").value = "";

    updateUI();
}

function drawChart(income, expense) {
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0,0,400,200);

    // Income bar
    ctx.fillStyle = "green";
    ctx.fillRect(50, 200 - income/10, 80, income/10);

    // Expense bar
    ctx.fillStyle = "red";
    ctx.fillRect(200, 200 - expense/10, 80, expense/10);

    ctx.fillStyle = "black";
    ctx.fillText("Income", 60, 190);
    ctx.fillText("Expense", 210, 190);
}

updateUI();

</script>

</body>
</html>
