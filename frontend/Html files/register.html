<!DOCTYPE html>
<html>
<head>
    <title>Register | LeadSense AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f4fd8, #34c6eb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 360px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #1f4fd8;
        }

        .tag {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #1f4fd8;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1f4fd8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163ea8;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            color: #1f4fd8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>LeadSense AI</h1>
    <div class="tag">Create your account</div>

    <input id="username" placeholder="Username">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <input id="confirm" type="password" placeholder="Confirm Password">
    <input id="phone" placeholder="Phone (10 digits)">
    <input id="location" placeholder="Detecting location..." readonly>

    <button onclick="register()">Register</button>

    <div class="error" id="error"></div>

    <div class="link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script>
/* ---------------- LOCATION AUTO DETECT ---------------- */

window.onload = detectLocation;

function detectLocation() {
    const loc = document.getElementById("location");
    loc.value = "Detecting location...";

    if (!navigator.geolocation) {
        enableManual();
        return;
    }

    navigator.geolocation.getCurrentPosition(async pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        try {
            const res = await fetch(
                `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
            );

            const data = await res.json();

            const a = data.address || {};
            const place = [
                a.city || a.town || a.village || "",
                a.state || "",
                a.country || ""
            ].filter(Boolean).join(", ");

            if (place.length < 3) enableManual();
            else {
                loc.value = place;
                loc.readOnly = true;
            }

        } catch {
            enableManual();
        }

    }, enableManual, {
        enableHighAccuracy: true,
        timeout: 8000
    });
}

function enableManual() {
    const loc = document.getElementById("location");
    loc.value = "";
    loc.placeholder = "Enter your location manually";
    loc.readOnly = false;
}

/* ---------------- REGISTER ---------------- */

function register() {
    const u = username.value.trim();
    const e = email.value.trim();
    const p = password.value;
    const c = confirm.value;
    const ph = phone.value.trim();
    const l = location.value.trim();
    const err = document.getElementById("error");

    err.textContent = "";

    if (!u || !e || !p || !c || !ph || !l) {
        err.textContent = "All fields required";
        return;
    }

    if (p !== c) {
        err.textContent = "Passwords do not match";
        return;
    }

    if (!/^[0-9]{10}$/.test(ph)) {
        err.textContent = "Phone must be 10 digits";
        return;
    }

    const user = { u, e, p, ph, l };
    localStorage.setItem("user_" + u, JSON.stringify(user));

    alert("Registration successful!");
    window.location = "login.html";
}
</script>

</body>
</html>
